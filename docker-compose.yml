services:
  kanbanex:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3210}:${PORT:-3210}"
    environment:
      PORT: ${PORT:-3210}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no ambiente ou no arquivo .env}
      KANBANEX_DB: /data/kanbanex.db
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
